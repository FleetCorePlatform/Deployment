name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-docs.yml'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout FleetCoreLib
        uses: actions/checkout@v4
        with:
          repository: FleetCorePlatform/FleetCoreLib
          path: FleetCoreLib

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: FleetCoreLib/pom.xml

      - name: Generate Javadoc
        run: ./mvnw javadoc:javadoc
        working-directory: FleetCoreLib

      - name: Copy Javadoc to Docusaurus
        run: |
          mkdir -p website/static/api
          cp -r FleetCoreLib/target/site/apidocs/* website/static/api/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install Dependencies
        run: npm install
        working-directory: website

      - name: Build Docusaurus Site
        run: npm run build
        working-directory: website

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/build
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
